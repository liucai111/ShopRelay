[project]
name = "shoprelay"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "jieba==0.42.1",
    "numpy==2.5.4",
    "fastapi==0.146.0",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.54.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg-pool==3.3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
llm = ["openai==2.14.0"]
formal = ["openai==2.14.0", "cryptography==50.0.2", "numpy==2.5.4"]
probe = ["openai>=1,<3", "qdrant-client>=1,<2", "mcp==2.2.0", "sentence-transformers>=3,<6", "psycopg[binary]>=3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["policy-review-test-*"]
